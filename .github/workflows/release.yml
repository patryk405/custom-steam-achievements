name: Build installable packages
on:
  push:
    branches: [main]
    paths: ['packaging/**', 'tracker/**', 'frontend/**', 'backend/**', 'resources/**', 'millennium.toml', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
      - name: Build portable plugin
        run: bun run build -- --of dist --release
      - run: python -m pip install pyinstaller==6.19.0
      - name: Bundle tracker
        run: python -m PyInstaller --noconfirm --clean --name csa-tracker --add-data "resources:resources" --hidden-import tkinter --collect-submodules tkinter tracker/daemon.py
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: ./dist/csa-tracker/csa-tracker --self-test
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: ./dist/csa-tracker/csa-tracker.exe --self-test
      - name: Adapter integration tests (Linux sockets)
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -q
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'packaging/install-windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Portable packaging tests
        run: python -m unittest discover -s tests -p test_packaging.py -v
      - run: python packaging/bundle.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/custom-steam-achievements-*.zip
            dist/custom-steam-achievements-*.sha256
            dist/local.custom-achievements.star
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.6.0 >/dev/null 2>&1 || gh release create v0.6.0 --target "$GITHUB_SHA" --title "0.6.0 — installable Windows and Linux preview" --notes-file packaging/README.txt
          gh release upload v0.6.0 release-assets/* --clobber
